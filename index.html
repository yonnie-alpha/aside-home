<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바로가기</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --text: #37352f;
    --muted: #9b9a97;
    --icon: #6b6b68;
    --circle: #ebebea;
    --circle-hover: #dededc;
    --mono-filter: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e6e6e4;
      --muted: #7d7c78;
      --icon: #b4b4b0;
      --circle: #2f2f2d;
      --circle-hover: #3b3b39;
      --mono-filter: invert(1);   /* 검정 아이콘(Notion)을 다크모드에서 흰색으로 */
    }
  }
  * {
    box-sizing: border-box;
    font-family: "Pretendard", "Pretendard Variable", sans-serif;
  }
  html { height: 100%; }
  body {
    margin: 0;
    padding: 4px 2px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: transparent;
    color: var(--text);
    text-align: center;
  }
  #app { width: 100%; }

  /* 카테고리(행) 사이 간격 */
  .row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 28px 28px;          /* 같은 줄 그룹 사이 간격 */
    margin-bottom: 40px;     /* 위아래 카테고리 사이 간격 */
  }
  .row:last-child { margin-bottom: 0; }

  .group-title {
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .02em;
    text-align: center;
    white-space: nowrap;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 10px;           /* 개별 아이템 사이 간격 */
  }
  a.tile {
    width: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
    color: var(--text);
    text-decoration: none;
  }
  .circle {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--circle);
    display: grid; place-items: center;
    transition: background .12s ease;
  }
  a.tile:hover .circle { background: var(--circle-hover); }
  .circle img { width: 30px; height: 30px; object-fit: contain; }
  .circle img.mono { filter: var(--mono-filter); }
  .circle svg {
    width: 22px; height: 22px;
    fill: none; stroke: var(--icon);
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  .label {
    width: 100%;
    font-size: 12px;
    line-height: 1.25;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: keep-all;
  }
</style>
</head>
<body>
<div id="app"></div>

  const LINK_ICON =
    '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/>' +
    '<path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';

  const app = document.getElementById("app");

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch { return url; }
  }

  function buildTile(item) {
    const name = item.label || hostOf(item.url);

    const a = document.createElement("a");
    a.className = "tile";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = name;

    const circle = document.createElement("div");
    circle.className = "circle";
    if (item.img && IMGS[item.img]) {
      const img = document.createElement("img");
      img.src = IMGS[item.img];
      img.alt = "";
      if (item.mono) img.className = "mono";
      circle.appendChild(img);
    } else {
      circle.innerHTML = LINK_ICON;   // 아이콘 미지정 시 기본 링크 아이콘
    }

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = name;

    a.append(circle, label);
    return a;
  }

  ROWS.forEach(groups => {
    const row = document.createElement("div");
    row.className = "row";

    groups.forEach(group => {
      const box = document.createElement("div");

      if (group.title) {
        const t = document.createElement("p");
        t.className = "group-title";
        t.textContent = group.title;
        box.appendChild(t);
      }

      const grid = document.createElement("div");
      grid.className = "grid";
      group.links.forEach(item => grid.appendChild(buildTile(item)));
      box.appendChild(grid);

      row.appendChild(box);
    });

    app.appendChild(row);
  });
</script>
